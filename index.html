<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragomat – Das Fragenrad</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f9f7ff;background:#080d1c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#40214f 0%,transparent 42%),radial-gradient(ellipse at 95% 15%,#143b55 0%,transparent 42%),#080d1c}header{max-width:1450px;margin:auto;padding:28px 24px 12px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-size:clamp(34px,5vw,56px);font-weight:950;letter-spacing:-2px;background:linear-gradient(100deg,#fff,#ffa5d2 60%,#7de8ff);color:transparent;background-clip:text}.subtitle{color:#aab6d5;font-size:14px;margin-top:3px}.chip{border:1px solid #5b547e;border-radius:40px;padding:9px 16px;background:#171a32;color:#e9d7fa;font-size:13px}main{max-width:1450px;margin:12px auto;padding:0 24px;display:grid;grid-template-columns:minmax(300px,.88fr) minmax(350px,1.12fr);gap:20px}.panel{border:1px solid #40466b;border-radius:25px;padding:23px;background:linear-gradient(150deg,#151b33e8,#0c172ae8);box-shadow:0 16px 55px #0005}h2{font-size:19px;margin:0 0 15px}.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}button{cursor:pointer;font:inherit;font-weight:800;border-radius:13px;padding:12px 15px;border:1px solid #4a5c82;background:#1a2a44;color:white;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.15)}button:active{transform:scale(.98)}button.active{background:linear-gradient(100deg,#d3368d,#7e55f3);border-color:#e779bd}button.primary{background:linear-gradient(100deg,#ff5d9c,#b95ef4,#45d6f2);border:0;color:#091225;font-weight:950}button.secondary{background:#172b43}button:disabled{opacity:.45;cursor:not-allowed}.helper{font-size:13px;line-height:1.6;color:#aebad5;margin:8px 0 14px}textarea{width:100%;min-height:290px;resize:vertical;background:#091426;border:1px solid #526184;color:white;border-radius:15px;padding:17px;font:15px/1.75 system-ui;outline:none}textarea:focus{border-color:#ef7bc1;box-shadow:0 0 0 3px #ef7bc126}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.count{font-size:13px;color:#b4c3dc;margin-top:11px}.wheelbox{position:relative;max-width:560px;margin:auto}canvas{display:block;width:100%;height:auto}.pointer{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-right:36px solid #fff;filter:drop-shadow(0 0 10px #fff9);z-index:3}.result{border:1px solid #405e7b;background:linear-gradient(145deg,#0a2033,#11172c);border-radius:22px;min-height:175px;text-align:center;padding:22px 16px;margin-top:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.result small{font-weight:900;letter-spacing:2px;color:#55e3f4}.question{font-size:clamp(22px,3vw,37px);line-height:1.3;font-weight:900;overflow-wrap:anywhere}.hint{color:#ffb6d8;font-size:clamp(18px,2.1vw,25px);font-weight:750}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.spin{width:100%;margin-top:13px;font-size:20px;padding:16px}.mode{display:flex;gap:10px;flex-wrap:wrap}.mode button{flex:1;min-width:170px}footer{text-align:center;padding:30px 10px 25px;font-size:15px;font-weight:900;color:#ff569b;letter-spacing:.3px}.info{color:#aebad5;font-size:13px;line-height:1.5}.toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:#d6dcef}.toggle input{accent-color:#f25ba8;width:18px;height:18px}.status{min-height:20px;color:#9be8f2;font-size:13px;margin-top:9px}.label{font-weight:800;font-size:14px;margin:12px 0 7px}input[type=text]{width:100%;padding:12px 14px;border:1px solid #526184;border-radius:12px;background:#0a1426;color:white;font:inherit}.manual{display:grid;grid-template-columns:1fr auto;gap:8px}.manual button{padding:10px 15px}.examples{color:#aebad5;font-size:12px;margin-top:8px}@media(max-width:880px){main{grid-template-columns:1fr}.panel{padding:17px}header{padding:22px 17px 10px}main{padding:0 13px}.pointer{right:-4px}textarea{min-height:200px}}

.topactions{display:flex;align-items:center;gap:10px}.topactions button{font-size:15px}
.gamebody{display:block}.wheelbox{max-width:650px}.result{min-height:205px}.question{font-size:clamp(26px,3.4vw,48px)}.hint{font-size:clamp(21px,2.4vw,31px)}
.beamer header{max-width:none;padding:12px 28px 2px}.beamer .subtitle{display:none}.beamer main{display:block;max-width:none;margin:0;padding:5px 24px}.beamer .editor{display:none}.beamer .game{padding:12px 22px;border:0;box-shadow:none;background:transparent}.beamer .game h2{display:none}.beamer .gamebody{display:grid;grid-template-columns:minmax(350px,1fr) minmax(400px,1fr);column-gap:clamp(20px,3vw,70px);align-items:center}.beamer .mode{grid-column:1/-1;justify-content:center;margin-bottom:4px}.beamer .mode button{flex:0 1 270px}.beamer .wheelbox{grid-column:1;grid-row:2/6;width:100%;max-width:min(70vh,720px)}.beamer .spin{grid-column:2;grid-row:3;margin:0;font-size:clamp(22px,2vw,30px);padding:20px}.beamer .result{grid-column:2;grid-row:2;min-height:clamp(210px,36vh,420px);padding:28px}.beamer .question{font-size:clamp(34px,4vw,70px)}.beamer .hint{font-size:clamp(25px,3vw,45px)}.beamer .gamebody>.controls{grid-column:2;grid-row:4}.beamer #wheelStatus{grid-column:2;grid-row:5}.beamer footer{padding:4px 10px 10px}
@media(max-width:1000px){.beamer .gamebody{display:block}.beamer .wheelbox{max-width:min(55vh,550px)}.beamer .result{min-height:150px}.beamer .question{font-size:clamp(28px,5vw,52px)}.beamer .spin{margin-top:10px}}
@media(max-width:600px){.topactions button{font-size:12px;padding:10px}.brand{font-size:34px}.beamer header{padding:10px}.beamer main{padding:0 8px}.beamer .game{padding:8px}.beamer .wheelbox{max-width:420px}}
</style></head><body><header><div><div class="brand">Fragomat <span style="font-size:.55em;vertical-align:middle">✦</span></div><div class="subtitle">Drehen. Fragen. Wissen.</div></div><div class="topactions"><button id="beamer" class="primary" aria-pressed="false">▣ Beamer-Modus</button></div></header><main><section class="panel editor"><h2>✎ Fragen</h2><div class="label">Frage hinzufügen</div><div class="manual"><input id="single" type="text" placeholder="Neue Frage"><button id="add">+ Hinzufügen</button></div><div class="label">Fragenliste</div><textarea id="questions" spellcheck="false" aria-label="Fragenliste"></textarea><div class="count" id="count"></div><div class="controls"><button id="apply" class="primary">✓ Fragen übernehmen</button><button id="shuffle">⇄ Liste mischen</button><button id="clear">✕ Liste löschen</button></div><div class="status" id="status" role="status"></div></section><section class="panel game"><h2>✦ Fragemodus</h2><div class="mode"><button id="with" class="active">💡 Frage mit Hinweis</button><button id="without">◉ Nur die Frage</button></div><div class="gamebody"><div class="wheelbox"><canvas id="wheel" width="700" height="700" aria-label="Drehbares Fragenrad"></canvas><div class="pointer" aria-hidden="true"></div></div><button id="spin" class="primary spin">RAD DREHEN ✦</button><div class="result"><small id="resultLabel">BEREIT</small><div class="question" id="questionOut">Dreh das Rad!</div><div class="hint" id="hintOut"></div><div class="actions"><button id="reveal" class="secondary" hidden>💡 Hinweis anzeigen</button><button id="remove" class="secondary" hidden>✕ Aus dem Rad entfernen</button></div></div><div class="controls" style="justify-content:space-between;align-items:center"><button id="reset">↻ Fragen zurück ins Rad</button><label class="toggle"><input id="sound" type="checkbox" checked> 🔊 Ton</label></div><div class="status" id="wheelStatus"></div></div></section></main><footer>Erstellt von Zsuzsanna Cseh Zsuzsanna Cseh Cseh Zsuzsanna</footer><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const sample=['Wann stehst du am Montag auf? (06:30 Uhr)','Wann frühstückst du? (07:00 Uhr)','Was isst du zum Frühstück? (Brot und Käse essen)','Wann beginnt die Schule? (08:00 Uhr)','Was machst du am Vormittag? (Deutsch lernen)','Wann isst du zu Mittag? (12:30 Uhr)','Was machst du am Nachmittag? (Hausaufgaben machen)','Wann kommst du nach Hause? (15:30 Uhr)','Wann räumst du dein Zimmer auf? (16:00 Uhr)','Was kaufst du am Samstag ein? (Brot und Milch)','Wann rufst du deine Freunde an? (18:15 Uhr)','Was machst du am Abend? (fernsehen)','Wann fängt der Film an? (20:15 Uhr)','Wann gehst du schlafen? (22:00 Uhr)','Was machst du am Sonntag? (spazieren gehen)','Was kochst du am Wochenende? (Nudeln kochen)','Wer macht bei euch das Frühstück?','Verstehst du die Aufgabe?','Sprichst du am Wochenende Deutsch?','Was machst du am Samstagabend? (mit Freunden spazieren gehen)'];const colors=['#f55a98','#32d5e9','#a17cf9','#ffbf52','#43dc99','#df6ef2','#5da6fa','#fb7a79','#a2e044','#35c4b7'];const canvas=$('wheel'),ctx=canvas.getContext('2d');let all=[],active=[],selected=null,angle=0,spinning=false,mode='with',revealed=false;const parse=s=>{let m=s.match(/^(.*?)(?:\s*\(([^()]*)\))?\s*$/);return {question:(m?.[1]||s).trim(),hint:(m?.[2]||'').trim(),full:s}};const getLines=()=> $('questions').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const save=()=>{try{localStorage.setItem('fragomat-questions-v3',$('questions').value)}catch(e){}};function setStatus(s){$('status').textContent=s}function updateCount(){$('count').textContent=`${active.length} Fragen im Rad • ${all.length} Fragen in der Liste`}function renderResult(){if(!selected){$('resultLabel').textContent='BEREIT';$('questionOut').textContent='Dreh das Rad!';$('hintOut').textContent='';$('reveal').hidden=true;$('remove').hidden=true;return}let p=parse(selected);$('resultLabel').textContent='AUSGEWÄHLT';$('questionOut').textContent=p.question;$('hintOut').textContent=(mode==='with'||revealed)&&p.hint?'('+p.hint+')':'';$('reveal').hidden=!(mode==='without'&&p.hint);$('reveal').textContent=revealed?'◉ Hinweis ausblenden':'💡 Hinweis anzeigen';$('remove').hidden=false}function draw(){const W=canvas.width,C=W/2,R=282;ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(C,C);let n=active.length;if(!n){ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.strokeStyle='#40e1f5';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#bdc9e2';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText('Fragen eingeben',0,12)}else{const step=Math.PI*2/n;for(let i=0;i<n;i++){let a=angle+i*step,b=a+step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,b);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#17203a';ctx.lineWidth=3;ctx.stroke();{ctx.save();ctx.rotate(a+step/2);ctx.translate(R*.72,0);let theta=a+step/2;let normalized=((theta%(Math.PI*2))+Math.PI*2)%(Math.PI*2);if(normalized>Math.PI/2&&normalized<3*Math.PI/2)ctx.rotate(Math.PI);ctx.fillStyle='#10172a';ctx.textAlign='center';ctx.textBaseline='middle';const label=parse(active[i]).question;const fontSize=n>55?11:n>35?12:n>22?14:n>12?16:18;ctx.font=`800 ${fontSize}px system-ui`;const maxWidth=R*.48;let shown=label;while(shown.length>3&&ctx.measureText(shown).width>maxWidth)shown=shown.slice(0,-2).trimEnd()+'…';ctx.fillText(shown,0,0,maxWidth);ctx.restore()}}ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.strokeStyle='#f6f6ff';ctx.lineWidth=6;ctx.stroke()}ctx.beginPath();ctx.arc(0,0,49,0,Math.PI*2);ctx.fillStyle='#0c1527';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 31px system-ui';ctx.fillText('✦',0,12);ctx.restore()}function refresh(){updateCount();draw();renderResult();$('spin').disabled=spinning||!active.length;$('wheelStatus').textContent=active.length?`${active.length} Fragen stehen zur Auswahl`:'Keine Fragen im Rad.'}function load(){if(spinning)return;all=getLines();active=[...all];selected=null;angle=0;save();refresh();setStatus(all.length?`${all.length} Fragen übernommen. Das Rad ist bereit.`:'Keine Fragen vorhanden.')}$('questions').value=(()=>{try{return localStorage.getItem('fragomat-questions-v3')||''}catch(e){return ''}})();const setBeamer=(on)=>{document.body.classList.toggle('beamer',on);$('beamer').textContent=on?'✕ Beamer-Modus beenden':'▣ Beamer-Modus';$('beamer').setAttribute('aria-pressed',String(on));setTimeout(draw,0)};$('beamer').onclick=()=>setBeamer(!document.body.classList.contains('beamer'));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('beamer'))setBeamer(false)});$('questions').addEventListener('input',()=>{save();$('count').textContent=`${active.length} Fragen im Rad • Änderungen noch nicht übernommen`});$('apply').onclick=load;$('add').onclick=()=>{let v=$('single').value.trim();if(!v)return;$('questions').value=($('questions').value.trim()?$('questions').value.trim()+'\n':'')+v;$('single').value='';load()};$('single').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});$('shuffle').onclick=()=>{if(spinning)return;let l=getLines();for(let i=l.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}$('questions').value=l.join('\n');load()};$('clear').onclick=()=>{if(spinning)return;$('questions').value='';load();setStatus('Die Fragenliste wurde gelöscht.')};$('with').onclick=()=>{mode='with';$('with').classList.add('active');$('without').classList.remove('active');renderResult()};$('without').onclick=()=>{mode='without';revealed=false;$('without').classList.add('active');$('with').classList.remove('active');renderResult()};$('reveal').onclick=()=>{revealed=!revealed;renderResult()};$('remove').onclick=()=>{if(spinning||!selected)return;let ix=active.indexOf(selected);if(ix>=0)active.splice(ix,1);selected=null;refresh()};$('reset').onclick=()=>{if(spinning)return;active=[...all];selected=null;angle=0;refresh();$('wheelStatus').textContent=all.length?'Alle Fragen sind wieder im Rad.':'Die Fragenliste ist leer.'};let audioCtx;function ping(){if(!$('sound').checked)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.15)}catch(e){}}$('spin').onclick=()=>{if(spinning||!active.length)return;spinning=true;selected=null;revealed=false;renderResult();$('spin').disabled=true;$('remove').hidden=true;const n=active.length,chosen=Math.floor(Math.random()*n),step=2*Math.PI/n;const target=((Math.PI*2-((chosen+.5)*step)%(2*Math.PI))%(2*Math.PI));const start=angle;let delta=((target-(start%(2*Math.PI))+2*Math.PI)%(2*Math.PI))+Math.PI*2*(5+Math.floor(Math.random()*3));const duration=3800;let begin=null,lastTick=-1;function frame(t){if(begin===null)begin=t;let p=Math.min(1,(t-begin)/duration),ease=1-Math.pow(1-p,4);angle=start+delta*ease;draw();let tick=Math.floor(ease*n*7);if(tick!==lastTick&&p<.88&&tick%3===0){ping();lastTick=tick}if(p<1)requestAnimationFrame(frame);else{angle=target;spinning=false;selected=active[chosen];refresh();ping()}}requestAnimationFrame(frame)};load();})();
</script></body></html>
